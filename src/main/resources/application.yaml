server:
  port: 8081

management:
  endpoint:
    health:
      show-details: always

spring:
  application:
    name: ledger
  mvc:
    problemdetails:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC
